<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_60" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="glow_60" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="24" fill="url(#bg_60)" stroke="#ffffff" stroke-opacity="0.08"/>
  <circle cx="500" cy="100" r="140" fill="#2563EB" opacity="0.12"/>
  <!-- Central Badge -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="120" height="32" rx="16" fill="#2563EB" fill-opacity="0.15" stroke="#2563EB" stroke-opacity="0.4"/>
    <text x="60" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#60A5FA" text-anchor="middle">FOUNDATION</text>
    
    <text x="0" y="100" font-family="system-ui, sans-serif" font-size="54" font-weight="900" fill="#ffffff" letter-spacing="-0.03em">60 DAYS</text>
    <text x="0" y="135" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#60A5FA">10 Specializations</text>
    <text x="0" y="165" font-family="system-ui, sans-serif" font-size="13" fill="#94A3B8">Daily 2-3 hrs structured study • Zero prior experience</text>
    
    <!-- Timeline meter -->
    <rect x="0" y="200" width="480" height="8" rx="4" fill="#1E293B"/>
    <rect x="0" y="200" width="210.0" height="8" rx="4" fill="url(#glow_60)"/>
    
    <!-- Highlights pills -->
