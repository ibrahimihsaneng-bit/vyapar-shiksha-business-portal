      <rect x="0" y="0" width="145" height="36" rx="10" fill="#1E293B" stroke="#ffffff" stroke-opacity="0.06"/>
      <text x="15" y="23" font-family="system-ui, sans-serif" font-size="12" fill="#E2E8F0">Practical Projects</text>
      
      <rect x="160" y="0" width="145" height="36" rx="10" fill="#1E293B" stroke="#ffffff" stroke-opacity="0.06"/>
      <text x="175" y="23" font-family="system-ui, sans-serif" font-size="12" fill="#E2E8F0">Verified Salary</text>
      
      <rect x="320" y="0" width="145" height="36" rx="10" fill="#1E293B" stroke="#ffffff" stroke-opacity="0.06"/>
      <text x="335" y="23" font-family="system-ui, sans-serif" font-size="12" fill="#E2E8F0">100% Free</text>
