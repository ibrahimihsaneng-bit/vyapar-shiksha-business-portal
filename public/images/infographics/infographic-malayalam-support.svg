      <text x="25" y="90" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">20 Structured Daily Lessons</text>
      
      <rect x="245" y="0" width="210" height="120" rx="14" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5"/>
