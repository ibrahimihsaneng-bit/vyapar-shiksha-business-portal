      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="20" fill="url(#info_bg_infograp)" stroke="#ffffff" stroke-opacity="0.08"/>
  <g transform="translate(50, 45)">
