    <text x="-330" y="86" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#F59E0B" text-anchor="middle">01</text>
    <text x="-285" y="72" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Ethical &amp; Halal Employment Shield Guarantee</text>
    <text x="-285" y="94" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8">Zero Experience Required • Practical Simulations • Portfolio Projects</text>
    <rect x="250" y="60" width="105" height="40" rx="10" fill="url(#accent)"/>
    <text x="302" y="85" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0B132B" text-anchor="middle">Explore</text>
