    <!-- Floating Cards -->
    <rect x="-380" y="-140" width="230" height="130" rx="16" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="-340" cy="-90" r="20" fill="#10B981" fill-opacity="0.2"/>
    <path d="M-348 -90 L-342 -84 L-332 -96" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <rect x="-305" y="-105" width="120" height="12" rx="6" fill="#ffffff" fill-opacity="0.8"/>
    <rect x="-305" y="-85" width="80" height="8" rx="4" fill="#10B981"/>
    <rect x="-305" y="-70" width="95" height="6" rx="3" fill="#ffffff" fill-opacity="0.3"/>

    <rect x="-115" y="-140" width="230" height="130" rx="16" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="-85" y="-105" width="140" height="14" rx="7" fill="url(#accent)"/>
    <rect x="-85" y="-80" width="100" height="8" rx="4" fill="#ffffff" fill-opacity="0.5"/>
    <rect x="-85" y="-65" width="120" height="8" rx="4" fill="#ffffff" fill-opacity="0.3"/>
    <circle cx="70" cy="-90" r="16" fill="#F59E0B" fill-opacity="0.2"/>
    <text x="70" y="-84" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#F59E0B" text-anchor="middle">30d</text>

